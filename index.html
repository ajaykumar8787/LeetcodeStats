<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeetMetrics</title>
    <link rel="stylesheet" href="leet.css">
</head>
<body>
    <div class="container">
        <h1>LeetMetrics</h1>

        <div class="user-container">
            <p>Enter your username below:</p>
            <div class="user-input-container">
                <input type="text" placeholder="Enter your username here" id="user-input" autocomplete="off">
                <button id="search-btn" onclick="fetchStats()">Search</button>
            </div>
        </div>

        <div id="result-message" style="margin-top: 10px; font-weight: bold;"></div>

        <div class="status-container">
            <div class="progress">

                <div class="progress-item">
                    <div class="easy-progress circle">
                        <div class="circle-title">Easy</div>
                        <div id="easy-label" class="circle-count">-</div>
                    </div>
                </div>

                <div class="progress-item">
                    <div class="medium-progress circle">
                        <div class="circle-title">Medium</div>
                        <div id="medium-label" class="circle-count">-</div>
                    </div>
                </div>

                <div class="progress-item">
                    <div class="hard-progress circle">
                        <div class="circle-title">Hard</div>
                        <div id="hard-progress" class="circle-count">-</div>
                    </div>
                </div>

            </div>

            <div class="stats-card">
                <div id="total-box" style="text-align: center; font-size: 24px; font-weight: bold; margin-top: 20px; color: #ffa116;">
                </div>
            </div>
        </div>
    </div>

    <script src="leet.js"></script>
</body>
</html>
